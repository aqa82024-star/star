<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ستاره‌های کارتونی رنگی</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02010a;
      font-family: Tahoma, system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .title {
      position: fixed;
      top: 22px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.15rem;
      pointer-events: none;
      text-shadow: 0 0 14px rgba(255, 200, 255, 0.5);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="title">✨ ستاره‌های کارتونی رنگارنگ</div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let w, h, stars = [];
    const STAR_COUNT = 280;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // رنگ‌های روشن و کارتونی
    function randomColor() {
      const colors = [
        '#ff0000', '#00ff00', '#0000ff',
        '#ff4d6d', '#ff85a2', '#ffb3c6',
        '#c77dff', '#9b5de5', '#7b2cbf',
        '#00f5d4', '#00bbf9', '#4cc9f0',
        '#fee440', '#f15bb5', '#00f5a0',
        '#ff9f1c', '#ffbf69', '#2ec4b6',
        '#e71d36', '#ff006e', '#8338ec',
        '#3a86ff', '#fb5607', '#ffbe0b',
        '#ffffff', '#a0e7e5', '#b4f8c8',
        '#ff6b6b', '#feca57', '#48dbfb',
        '#ff9ff3', '#54a0ff', '#5f27cd'
      ];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // کشیدن ستاره ۵‌پر کارتونی
    function drawCartoonStar(ctx, x, y, size, color, alpha, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.globalAlpha = alpha;

      // سایه‌ی نرم پشت ستاره
      ctx.beginPath();
      drawStarPath(ctx, 0, 0, 5, size * 1.15, size * 0.48);
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha * 0.25;
      ctx.fill();

      // خود ستاره
      ctx.beginPath();
      drawStarPath(ctx, 0, 0, 5, size, size * 0.42);
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.fill();

      // خط دور ستاره (کارتونی‌تر بشه)
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = Math.max(0.8, size * 0.12);
      ctx.stroke();

      // نقطه‌ی روشن وسط برای حس سه‌بعدی کارتونی
      ctx.beginPath();
      ctx.arc(0, -size * 0.08, size * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.globalAlpha = alpha * 0.8;
      ctx.fill();

      ctx.restore();
    }

    function drawStarPath(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 11 + 5,
          speed: Math.random() * 0.4 + 0.08,
          color: randomColor(),
          alpha: Math.random() * 0.45 + 0.55,
          twinkleSpeed: Math.random() * 0.035 + 0.012,
          twinkleOffset: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.18,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.025
        });
      }
    }
    createStars();

    let time = 0;

    function draw() {
      ctx.fillStyle = 'rgba(2, 1, 10, 0.32)';
      ctx.fillRect(0, 0, w, h);

      time += 0.016;

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];

        const twinkle = 0.6 + 0.4 * Math.sin(time * s.twinkleSpeed * 55 + s.twinkleOffset);
        const alpha = s.alpha * twinkle;

        s.y += s.speed;
        s.x += s.drift;
        s.rotation += s.rotSpeed;

        if (s.y > h + 30) {
          s.y = -30;
          s.x = Math.random() * w;
          s.color = randomColor();
          s.size = Math.random() * 11 + 5;
        }
        if (s.x < -30) s.x = w + 30;
        if (s.x > w + 30) s.x = -30;

        drawCartoonStar(ctx, s.x, s.y, s.size, s.color, alpha, s.rotation);
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    draw();

    function addBurst(x, y) {
      for (let i = 0; i < 14; i++) {
        stars.push({
          x: x + (Math.random() - 0.5) * 50,
          y: y + (Math.random() - 0.5) * 50,
          size: Math.random() * 13 + 6,
          speed: Math.random() * 0.9 + 0.25,
          color: randomColor(),
          alpha: 1,
          twinkleSpeed: Math.random() * 0.05 + 0.02,
          twinkleOffset: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.7,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.04
        });
      }
      if (stars.length > 480) {
        stars.splice(0, stars.length - 380);
      }
    }

    canvas.addEventListener('click', (e) => addBurst(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      addBurst(t.clientX, t.clientY);
    }, { passive: false });
  </script>
</body>
</html>
